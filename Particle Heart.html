<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Heart</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            cursor: grab;
        }
        body:active {
            cursor: grabbing;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <script>
        let scene, camera, renderer;
        let heartParticles, ambientParticles, spiralParticles;
        let originalPositions = [], scatteredPositions = [];
        let particleVelocities = [], particleColors = [];
        const HEART_PARTICLE_COUNT = 38000;
        const AMBIENT_PARTICLE_COUNT = 500;
        const SPIRAL_PARTICLE_COUNT = 40500;
        let mouse = new THREE.Vector2(-9999, -9999);
        let raycaster = new THREE.Raycaster();
        let isMouseDown = false;
        let previousMousePosition = { x: 0, y: 0 };
        let targetRotation = { x: 0, y: 0 };
        let currentRotation = { x: 0, y: 0 };
        let clock = new THREE.Clock();
        let heartGroup = new THREE.Group();
        const ASSEMBLY_DURATION = 9.0;
        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.18, 'rgba(255, 60, 140, 0.95)');
            gradient.addColorStop(0.45, 'rgba(220, 0, 75, 0.45)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(32, 32, 32, 0, Math.PI * 2);
            ctx.fill();
            return new THREE.CanvasTexture(canvas);
        }

        function sampleHeartVolume() {
            let found = false;
            let x, y, z;
            
            while (!found) {
                x = (Math.random() * 2 - 1) * 1.5;
                y = (Math.random() * 2 - 1) * 1.5;
                z = (Math.random() * 2 - 1) * 1.5;
                const x2 = x * x;
                const y2 = y * y;
                const z2 = z * z;
                const term1 = x2 + 2.25 * z2 + y2 - 1;
                const formula = (term1 * term1 * term1) - (x2 * y2 * y) - (0.1125 * z2 * y2 * y);
                if (formula <= 0) {
                    found = true;
                }
            }
            
            const scale = 3.2;
            return new THREE.Vector3(x * scale, y * scale, z * scale);
        }

        function initScene() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.018);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 12;
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x000000, 1);
            container.appendChild(renderer.domElement);
            scene.add(heartGroup);
        }

        function initHeartParticles() {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(HEART_PARTICLE_COUNT * 3);
            const colors = new Float32Array(HEART_PARTICLE_COUNT * 3);
            const sizes = new Float32Array(HEART_PARTICLE_COUNT);
            const particleTexture = createParticleTexture();
            for (let i = 0; i < HEART_PARTICLE_COUNT; i++) {
                const heartPos = sampleHeartVolume();
                originalPositions.push(heartPos.x, heartPos.y, heartPos.z);
                const radius = 18 + Math.random() * 30;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(Math.random() * 2 - 1);
                const scX = radius * Math.sin(phi) * Math.cos(theta);
                const scY = radius * Math.sin(phi) * Math.sin(theta);
                const scZ = radius * Math.cos(phi);
                scatteredPositions.push(scX, scY, scZ);
                positions[i * 3] = scX;
                positions[i * 3 + 1] = scY;
                positions[i * 3 + 2] = scZ;
                const distFromCenter = heartPos.length();
                const color = new THREE.Color();
                
                if (distFromCenter < 1.4) {
                    color.setHSL(0.95 + Math.random() * 0.05, 1.0, 0.65);
                } else if (distFromCenter < 2.7) {
                    color.setHSL(0.90 + Math.random() * 0.08, 0.95, 0.55);
                } else {
                    color.setHSL(0.82 + Math.random() * 0.12, 0.92, 0.62);
                }

                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
                sizes[i] = (Math.random() * 0.20 + 0.08);
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            const material = new THREE.PointsMaterial({
                size: 0.24,
                vertexColors: true,
                map: particleTexture,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: 0.88
            });

            heartParticles = new THREE.Points(geometry, material);
            heartGroup.add(heartParticles);
        }

        function initBackgroundEffects() {
            const ambGeo = new THREE.BufferGeometry();
            const ambPos = new Float32Array(AMBIENT_PARTICLE_COUNT * 3);
            const ambCols = new Float32Array(AMBIENT_PARTICLE_COUNT * 3);
            for (let i = 0; i < AMBIENT_PARTICLE_COUNT; i++) {
                const r = 12 + Math.random() * 30;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(Math.random() * 2 - 1);
                ambPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                ambPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                ambPos[i * 3 + 2] = r * Math.cos(phi);
                const c = new THREE.Color();
                c.setHSL(0.85 + Math.random() * 0.18, 0.8, 0.35 + Math.random() * 0.4);
                ambCols[i * 3] = c.r;
                ambCols[i * 3 + 1] = c.g;
                ambCols[i * 3 + 2] = c.b;
            }

            ambGeo.setAttribute('position', new THREE.BufferAttribute(ambPos, 3));
            ambGeo.setAttribute('color', new THREE.BufferAttribute(ambCols, 3));
            const ambMat = new THREE.PointsMaterial({
                size: 0.13,
                vertexColors: true,
                map: createParticleTexture(),
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.45
            });

            ambientParticles = new THREE.Points(ambGeo, ambMat);
            scene.add(ambientParticles);
            const spiralGeo = new THREE.BufferGeometry();
            const spiralPos = new Float32Array(SPIRAL_PARTICLE_COUNT * 3);
            const spiralCols = new Float32Array(SPIRAL_PARTICLE_COUNT * 3);
            for (let i = 0; i < SPIRAL_PARTICLE_COUNT; i++) {
                const t = (i / SPIRAL_PARTICLE_COUNT) * Math.PI * 14;
                const radius = 2.2 + (i / SPIRAL_PARTICLE_COUNT) * 5.0;
                spiralPos[i * 3] = Math.cos(t) * radius + (Math.random() - 0.5) * 0.5;
                spiralPos[i * 3 + 1] = (i / SPIRAL_PARTICLE_COUNT - 0.5) * 9.0 + (Math.random() - 0.5) * 0.5;
                spiralPos[i * 3 + 2] = Math.sin(t) * radius + (Math.random() - 0.5) * 0.5;
                const col = new THREE.Color();
                col.setHSL(0.88 + (i / SPIRAL_PARTICLE_COUNT) * 0.2, 1.0, 0.6);
                spiralCols[i * 3] = col.r;
                spiralCols[i * 3 + 1] = col.g;
                spiralCols[i * 3 + 2] = col.b;
            }

            spiralGeo.setAttribute('position', new THREE.BufferAttribute(spiralPos, 3));
            spiralGeo.setAttribute('color', new THREE.BufferAttribute(spiralCols, 3));
            const spiralMat = new THREE.PointsMaterial({
                size: 0.18,
                vertexColors: true,
                map: createParticleTexture(),
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.65
            });

            spiralParticles = new THREE.Points(spiralGeo, spiralMat);
            heartGroup.add(spiralParticles);
        }

        function initInteractions() {
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('pointermove', (event) => {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                if (isMouseDown) {
                    const deltaX = event.clientX - previousMousePosition.x;
                    const deltaY = event.clientY - previousMousePosition.y;
                    targetRotation.y += deltaX * 0.005;
                    targetRotation.x += deltaY * 0.005;
                }

                previousMousePosition = { x: event.clientX, y: event.clientY };
            });

            window.addEventListener('pointerdown', (event) => {
                isMouseDown = true;
                previousMousePosition = { x: event.clientX, y: event.clientY };
            });

            window.addEventListener('pointerup', () => {
                isMouseDown = false;
            });

            window.addEventListener('touchmove', (event) => {
                if (event.touches.length > 0) {
                    const touch = event.touches[0];
                    mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;

                    if (isMouseDown) {
                        const deltaX = touch.clientX - previousMousePosition.x;
                        const deltaY = touch.clientY - previousMousePosition.y;

                        targetRotation.y += deltaX * 0.005;
                        targetRotation.x += deltaY * 0.005;
                    }
                    previousMousePosition = { x: touch.clientX, y: touch.clientY };
                }
            }, { passive: true });

            window.addEventListener('touchstart', (event) => {
                if (event.touches.length > 0) {
                    isMouseDown = true;
                    previousMousePosition = { x: event.touches[0].clientX, y: event.touches[0].clientY };
                }
            }, { passive: true });

            window.addEventListener('touchend', () => {
                isMouseDown = false;
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();
            const rawProgress = Math.min(1.0, elapsedTime / ASSEMBLY_DURATION);
            const assemblyProgress = rawProgress * rawProgress * (3 - 2 * rawProgress);
            let pulseScale = 1.0;
            currentRotation.x += (targetRotation.x - currentRotation.x) * 0.05;
            currentRotation.y += (targetRotation.y - currentRotation.y) * 0.05;
            heartGroup.rotation.y = currentRotation.y + Math.sin(elapsedTime * 0.5) * 0.15;
            heartGroup.rotation.x = currentRotation.x + Math.cos(elapsedTime * 0.4) * 0.08;
            heartGroup.rotation.z = Math.sin(elapsedTime * 0.3) * 0.05;

            if (ambientParticles) {
                ambientParticles.rotation.y = elapsedTime * 0.025;
                ambientParticles.rotation.x = elapsedTime * 0.012;
            }

            if (spiralParticles) {
                spiralParticles.rotation.y = -elapsedTime * 0.35;
            }

            const positions = heartParticles.geometry.attributes.position.array;
            const colors = heartParticles.geometry.attributes.color.array;
            raycaster.setFromCamera(mouse, camera);
            const planeZ = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
            const mouseWorldPos = new THREE.Vector3();
            raycaster.ray.intersectPlane(planeZ, mouseWorldPos);
            for (let i = 0; i < HEART_PARTICLE_COUNT; i++) {
                const idx = i * 3;
                const scX = scatteredPositions[idx];
                const scY = scatteredPositions[idx + 1];
                const scZ = scatteredPositions[idx + 2];
                const origX = originalPositions[idx];
                const origY = originalPositions[idx + 1];
                const origZ = originalPositions[idx + 2];
                const swirlAngle = (1 - assemblyProgress) * Math.PI * 4;
                const cosA = Math.cos(swirlAngle);
                const sinA = Math.sin(swirlAngle);
                let interpolatedX = scX + (origX - scX) * assemblyProgress;
                let interpolatedY = scY + (origY - scY) * assemblyProgress;
                let interpolatedZ = scZ + (origZ - scZ) * assemblyProgress;

                if (assemblyProgress < 1.0) {
                    const rotX = interpolatedX * cosA - interpolatedZ * sinA;
                    const rotZ = interpolatedX * sinA + interpolatedZ * cosA;
                    interpolatedX = rotX;
                    interpolatedZ = rotZ;
                }

                let targetX = interpolatedX * (assemblyProgress > 0.5 ? pulseScale : 1.0);
                let targetY = interpolatedY * (assemblyProgress > 0.5 ? pulseScale : 1.0);
                let targetZ = interpolatedZ * (assemblyProgress > 0.5 ? pulseScale : 1.0);

                if (assemblyProgress > 0.3) {
                    const currentPos = new THREE.Vector3(positions[idx], positions[idx + 1], positions[idx + 2]);
                    const worldParticlePos = currentPos.clone().applyMatrix4(heartGroup.matrixWorld);
                    const distToMouse = worldParticlePos.distanceTo(mouseWorldPos);
                    const repelThreshold = 2.4;

                    if (distToMouse < repelThreshold) {
                        const force = (1 - distToMouse / repelThreshold) * 2.0;
                        const dir = worldParticlePos.clone().sub(mouseWorldPos).normalize();
                        targetX += dir.x * force * 2.2;
                        targetY += dir.y * force * 2.2;
                        targetZ += dir.z * force * 2.2;
                    }
                }

                positions[idx] += (targetX - positions[idx]) * 0.10;
                positions[idx + 1] += (targetY - positions[idx + 1]) * 0.10;
                positions[idx + 2] += (targetZ - positions[idx + 2]) * 0.10;
                if (pulseScale > 1.05 && assemblyProgress > 0.8) {
                    const colorShift = (pulseScale - 1.0) * 0.5;
                    colors[idx] = Math.min(1.0, colors[idx] + colorShift * 0.12);
                    colors[idx + 1] = Math.min(1.0, colors[idx + 1] + colorShift * 0.06);
                }
            }

            heartParticles.geometry.attributes.position.needsUpdate = true;
            heartParticles.geometry.attributes.color.needsUpdate = true;
            renderer.render(scene, camera);
        }

        window.onload = function () {
            initScene();
            initHeartParticles();
            initBackgroundEffects();
            initInteractions();
            animate();
        };
    </script>
</body>
</html>
